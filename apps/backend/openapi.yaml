openapi: 3.1.0
info:
  title: JogjaCenter Backend API
  version: 1.0.0
  description: |-
    Full HTTP API for authentication, user management, system preferences,
    dashboard menus, menu content, Superset connections, and audit logs.
    All endpoints are served under `/api` and return JSON.

    Authentication uses Laravel Sanctum bearer tokens. Public endpoints do not
    require a token. Role-restricted endpoints require one of the following:

    - `superadmin`: `/app/user/invite`, `/app/setting/preference*`, and
      `POST /app/dashboard/menu`
    - `superadmin` or `admin`: the remaining `/app/dashboard/*` endpoints
      (`menu`, `menu/{id}`, `content`, `content/{id}`, `superset`,
      `superset/{id}`, `logs`, `logs/{id}`)
    - Any authenticated user: `/auth/logout`
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api
    description: Current host
tags:
  - name: Authentication
    description: Login, logout, and session operations
  - name: Password Recovery
    description: Request and complete a password reset
  - name: User Management
    description: Inviting and registering users
  - name: System Settings
    description: Application-wide preferences
  - name: Dashboard Menu
    description: Managing the application navigation structure
  - name: Menu Content
    description: Managing specific content items within menus
  - name: Superset
    description: External data integration settings
  - name: Audit Logs
    description: System activity and event logs

paths:
  # --- AUTHENTICATION & PASSWORD RECOVERY ---
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with email or username and create an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              anyOf:
                - required: [email]
                - required: [username]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                username:
                  type: string
                  example: budibudi
                password:
                  type: string
                  format: password
                  example: "Password123"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    description: Plain text Sanctum API token.
        "401":
          description: Email/username or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current API token
      security:
        - sanctumBearer: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/request-reset:
    post:
      tags: [Password Recovery]
      operationId: requestPasswordReset
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                id:
                  type: [string, "null"]
                  minLength: 64
                  maxLength: 64
                  description: Optional ID from an earlier reset request.
      responses:
        "200":
          description: Existing reset request is still valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: Reset email queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "404":
          description: No registered user with this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/validate-reset:
    post:
      tags: [Password Recovery]
      operationId: validatePasswordReset
      summary: Validate the code from the reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, code]
              properties:
                id:
                  type: string
                  minLength: 64
                  maxLength: 64
                code:
                  type: string
                  minLength: 9
                  maxLength: 9
                  pattern: '^\d{9}$'
                  example: "123456789"
      responses:
        "201":
          description: Code accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "404":
          description: Reset request or code is invalid/expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/reset:
    post:
      tags: [Password Recovery]
      operationId: resetPassword
      summary: Set a new password using the reset token
      security:
        - resetBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, password]
              properties:
                id:
                  type: string
                  minLength: 64
                  maxLength: 64
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Reset request or token invalid/expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/register/validate:
    post:
      tags: [User Management]
      operationId: validateInvitation
      summary: Validate an invitation ID before registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Invitation ID from the invitation link.
      responses:
        "200":
          description: Invitation is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Invitation invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/register:
    post:
      tags: [User Management]
      operationId: acceptInvitation
      summary: Accept an invitation and create the user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, fullname, username, password, password_confirmation]
              properties:
                id:
                  type: string
                  description: Invitation ID from the invitation link.
                fullname:
                  type: string
                  maxLength: 100
                username:
                  type: string
                  minLength: 5
                  maxLength: 30
                  description: Must be unique among non-deleted users.
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Must contain at least one uppercase letter, one lowercase letter, and one number.
                password_confirmation:
                  type: string
                  format: password
                  description: Must match `password`.
      responses:
        "200":
          description: Invitation accepted and account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Invitation invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  # --- APP MODULES (Protected) ---
  /app/user/invite:
    post:
      tags: [User Management]
      operationId: inviteUser
      summary: Invite a new user
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, inviter]
              properties:
                email:
                  type: string
                  format: email
                  description: Disposable email addresses are rejected.
                role:
                  type: integer
                  description: Existing role ID.
                inviter:
                  type: integer
                  description: Existing user ID of the inviter.
      responses:
        "200":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Invitation request invalid (role or inviter not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /app/setting/preference:
    get:
      tags: [System Settings]
      operationId: listPreferences
      summary: List all preferences
      security:
        - sanctumBearer: []
      responses:
        "200":
          description: Preferences retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Preference"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [System Settings]
      operationId: addPreference
      summary: Add a new preference
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value, type]
              properties:
                key:
                  type: string
                  maxLength: 255
                value:
                  type: string
                  description: Text value. Use multipart/form-data with a file when type is image.
                type:
                  type: string
                  enum: ["text", "image"]
          multipart/form-data:
            schema:
              type: object
              required: [key, value, type]
              properties:
                key:
                  type: string
                  maxLength: 255
                value:
                  type: string
                  format: binary
                  description: |-
                    Image file when type is image. Rules depend on the key:
                    keys containing `favicon` accept ICO/PNG up to 512 KB;
                    keys containing `logo` accept PNG/JPG/JPEG up to 2 MB;
                    keys containing `home`, `photo`, or `foto` accept JPG/JPEG/PNG up to 5 MB;
                    all other keys accept PNG/JPG/JPEG/WebP up to 5 MB.
                    Images are converted to WebP (favicons are stored as-is).
                type:
                  type: string
                  enum: ["text", "image"]
      responses:
        "200":
          description: Preference added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Preference"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Preference already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    put:
      tags: [System Settings]
      operationId: updatePreference
      summary: Update a preference
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                key:
                  type: string
                  maxLength: 255
                value:
                  type: string
                  description: Text value. Use multipart/form-data with a file when the preference type is image.
                type:
                  type: string
                  enum: ["text", "image"]
              description: Send one or more of `key`, `value`, or `type` to change the preference. Changing `type` requires a matching `value`.
          multipart/form-data:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                key:
                  type: string
                  maxLength: 255
                value:
                  type: string
                  format: binary
                  description: |-
                    Replacement image file when the preference type is image. Rules depend on the key:
                    keys containing `favicon` accept ICO/PNG up to 512 KB;
                    keys containing `logo` accept PNG/JPG/JPEG up to 2 MB;
                    keys containing `home`, `photo`, or `foto` accept JPG/JPEG/PNG up to 5 MB;
                    all other keys accept PNG/JPG/JPEG/WebP up to 5 MB.
                    Images are converted to WebP (favicons are stored as-is).
                type:
                  type: string
                  enum: ["text", "image"]
              description: Send one or more of `key`, `value`, or `type` to change the preference. Changing `type` requires a matching `value`. Sending a file requires type to be image (or the preference to already be an image).
      responses:
        "200":
          description: Preference updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Preference"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Preference not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [System Settings]
      operationId: deletePreference
      summary: Delete a preference
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
      responses:
        "200":
          description: Preference deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Preference not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /app/setting/preference/{id}:
    get:
      tags: [System Settings]
      operationId: showPreference
      summary: Get a preference by ID
      security:
        - sanctumBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preference retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Preference"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Preference not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /app/dashboard/menu:
    get:
      tags: [Dashboard Menu]
      operationId: listMenus
      summary: List all menus
      security:
        - sanctumBearer: []
      responses:
        "200":
          description: Menus retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Menu"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Dashboard Menu]
      operationId: addMenu
      summary: Add a new menu
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, visibility]
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 1000
                visibility:
                  type: string
                  enum: ["public", "private", "off"]
      responses:
        "200":
          description: Menu added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

    put:
      tags: [Dashboard Menu]
      operationId: updateMenu
      summary: Update a menu
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
                  enum: ["public", "private", "off"]
              description: At least one of `name`, `description`, or `visibility` must be provided.
      responses:
        "200":
          description: Menu updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Menu not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [Dashboard Menu]
      operationId: deleteMenu
      summary: Delete a menu
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: Menu deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Menu not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /app/dashboard/menu/{id}:
    get:
      tags: [Dashboard Menu]
      operationId: showMenu
      summary: Get a menu by ID
      security:
        - sanctumBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Menu retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Menu"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Menu not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /app/dashboard/content:
    get:
      tags: [Menu Content]
      operationId: listMenuContents
      summary: List all menu content items
      security:
        - sanctumBearer: []
      responses:
        "200":
          description: Menu content retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenuContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Menu Content]
      operationId: addMenuContent
      summary: Add content to a menu
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, superset_id, menu_id, visibility]
              properties:
                name:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 1000
                superset_id:
                  type: string
                  minLength: 36
                  maxLength: 36
                  description: Superset dashboard identifier (36 characters).
                menu_id:
                  type: integer
                  description: Existing menu ID.
                visibility:
                  type: string
                  enum: ["public", "private", "off"]
      responses:
        "200":
          description: Content added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

    put:
      tags: [Menu Content]
      operationId: updateMenuContent
      summary: Update menu content
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                name:
                  type: string
                  maxLength: 255
                description:
                  type: string
                superset_id:
                  type: string
                  minLength: 36
                  maxLength: 36
                menu_id:
                  type: integer
                visibility:
                  type: string
                  enum: ["public", "private", "off"]
              description: At least one of `name`, `description`, `superset_id`, `menu_id`, or `visibility` must be provided.
      responses:
        "200":
          description: Content updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Content not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [Menu Content]
      operationId: deleteMenuContent
      summary: Delete menu content
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: Content deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Content not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /app/dashboard/content/{id}:
    get:
      tags: [Menu Content]
      operationId: showMenuContent
      summary: Get a menu content item by ID
      security:
        - sanctumBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Content retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MenuContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Content not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /app/dashboard/superset:
    get:
      tags: [Superset]
      operationId: listSupersets
      summary: List all Superset connections
      security:
        - sanctumBearer: []
      responses:
        "200":
          description: Superset connections retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Superset"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Superset]
      operationId: addSuperset
      summary: Add a new Superset connection
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, username, password]
              properties:
                host:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Superset added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

    put:
      tags: [Superset]
      operationId: updateSuperset
