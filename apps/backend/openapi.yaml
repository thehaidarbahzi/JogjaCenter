            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /app/dashboard/logs:
    get:
      tags: [Audit Logs]
      operationId: listActivityLogs
      summary: List activity logs with optional filters
      security:
        - sanctumBearer: []
      parameters:
        - name: log_name
          in: query
          schema:
            type: string
        - name: event
          in: query
          schema:
            type: string
        - name: causer_id
          in: query
          schema:
            type: integer
        - name: subject_type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
