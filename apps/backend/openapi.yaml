                  type: string
                host:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  format: password
              description: At least one of `host`, `username`, or `password` must be provided.
      responses:
        "200":
          description: Superset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
