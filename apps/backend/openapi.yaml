          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Activity log not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: API token returned by `/auth/login`.
    resetBearer:
      type: http
      scheme: bearer
      bearerFormat: Reset token
      description: Password reset token returned by `/auth/validate-reset`.

  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Token:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Preference:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        value:
          type: string
          description: Text value, or the relative storage path for image preferences.
        type:
          type: string
          enum: ["text", "image"]
        url:
          type: [string, "null"]
          description: Public URL for image preferences; null for text preferences.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Menu:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        description:
          type: string
        visibility:
          type: string
          enum: ["public", "private", "off"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MenuContent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 255
        description:
          type: string
        superset_id:
          type: string
          minLength: 36
          maxLength: 36
        menu_id:
          type: integer
        visibility:
          type: string
          enum: ["public", "private", "off"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Superset:
      type: object
      properties:
        id:
          type: integer
        host:
          type: string
        username:
          type: string
        password:
          type: string
          description: Superset password as stored and returned by the current implementation.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Activity:
      type: object
      properties:
        id:
          type: integer
        log_name:
          type: [string, "null"]
        description:
          type: string
        subject_type:
          type: [string, "null"]
        subject_id:
          type: [integer, string, "null"]
        causer_type:
          type: [string, "null"]
        causer_id:
          type: [integer, string, "null"]
        attribute_changes:
          type: [object, "null"]
          additionalProperties: true
        properties:
          type: [object, "null"]
          additionalProperties: true
        event:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    ValidationError:
      description: Request fields failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    UnprocessableEntity:
      description: Request could not be processed (validation failure or image processing error)
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/Message"
    Unauthenticated:
      description: Missing or invalid Sanctum API token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: Unauthenticated.
    Forbidden:
      description: Authenticated user does not have the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: "Forbidden: Insufficient permissions"
